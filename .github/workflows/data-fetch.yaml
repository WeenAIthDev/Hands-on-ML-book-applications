on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 6"
      timezone: "Asia/Kolkata"

jobs:
   dataset-fetch:
      runs-on: ubuntu-latest
      steps:
        - name: Install kaggle
          run: |
               pip install kaggle
               kaggle datasets list
          env:
            KAGGLE_API_TOKEN: ${{secrets.KAGGLE_API_TOKEN}}
