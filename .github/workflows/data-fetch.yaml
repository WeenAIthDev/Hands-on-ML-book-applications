on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 6"
      timezone: "Asia/Kolkata"

jobs:
   dataset-fetch:
      runs-on: ubuntu-latest
      steps:
        - name: Install kaggle
          run: |
               pip install kaggle
               kaggle datasets download -d camnugent/california-housing-prices
          env:
            KAGGLE_API_TOKEN: ${{secrets.KAGGLE_API_TOKEN}}

        - name: upload-artifacts
          uses: actions/upload-artifact@v7
          with:
           name: california-housing-prices
           path: california-housing-prices.zip     

        - name: unzip file
          run: |
               mkdir -p data/california-housing-prices
               unzip california-housing-prices.zip -d data/california-housing-prices

        - name: Inspecting files
          run: ls -R data/california-housing-prices        

